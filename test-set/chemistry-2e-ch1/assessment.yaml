# Fixed settings for this case's assessment: the same objectives and 15-question mix every run,
# with no custom instructions. The objectives are those of a Current dev lesson made from the
# same source (dev 1f1038d), so an assessment and a lesson cover the same ground.
objectives:
  - "Classify matter as elements, compounds, homogeneous mixtures, or heterogeneous mixtures based on physical state, composition, and atomic structure."
  - "Differentiate between physical and chemical properties and changes, categorizing measurable characteristics as either extensive or intensive."
  - "Apply the principles of uncertainty, precision, accuracy, and significant figures to record measurements and solve numerical problems."
  - "Calculate derived properties such as density and solve multi-step calculations using dimensional analysis and standard SI unit conversion factors."
  - "Convert temperature measurements between the Fahrenheit, Celsius, and Kelvin temperature scales using appropriate linear formulas."
questions:
  - {type: multiple_choice, bloom_type: knowledge, quantity: 2}
  - {type: multiple_choice, bloom_type: comprehension, quantity: 2}
  - {type: multiple_choice, bloom_type: application, quantity: 2}
  - {type: multiple_choice, bloom_type: analysis, quantity: 2}
  - {type: short_answer, bloom_type: comprehension, quantity: 1}
  - {type: short_answer, bloom_type: application, quantity: 1}
  - {type: short_answer, bloom_type: analysis, quantity: 1}
  - {type: fill_in, bloom_type: knowledge, quantity: 1}
  - {type: fill_in, bloom_type: comprehension, quantity: 1}
  - {type: open_ended, bloom_type: analysis, quantity: 1}
  - {type: open_ended, bloom_type: evaluation, quantity: 1}
