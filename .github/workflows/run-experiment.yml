# Runs every test case against a CollageAI site (dev, or a pull request's Render preview)
# and saves the results. Manual for now: Actions tab -> Run experiment -> Run workflow.
name: Run experiment

on:
  workflow_dispatch:
    inputs:
      target:
        description: "'dev', or 'pr-<number>' for a CollageAI pull request with the render-preview label"
        required: true
        default: dev

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the test cases
        env:
          # Passed through env, never pasted into the script, so the input cannot inject shell code.
          TARGET: ${{ inputs.target }}
          RUNNER_DEV_URL: ${{ vars.RUNNER_DEV_URL }}
          RUNNER_TEACHER_EMAIL: ${{ secrets.RUNNER_TEACHER_EMAIL }}
          RUNNER_TEACHER_PASSWORD: ${{ secrets.RUNNER_TEACHER_PASSWORD }}
        run: python -m runner --target "$TARGET"

      - name: Save the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.target }}
          path: outputs/
          if-no-files-found: warn
